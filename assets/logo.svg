<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Academic Paper Copilot">
  <title>Academic Paper Copilot</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The badge -->
  <rect width="256" height="256" rx="56" fill="url(#badge)"/>
  <rect width="256" height="120" rx="56" fill="url(#sheen)"/>

  <!-- The page -->
  <rect x="58" y="52" width="124" height="152" rx="14" fill="#ffffff" fill-opacity="0.97"/>
  <rect x="58" y="52" width="124" height="152" rx="14" fill="none" stroke="#0f172a" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Lines, in pairs: the paper's own sentence, then its translation. That
       alternation is the whole idea of the product, so it is the whole idea of
       the mark. -->
  <g>
    <rect x="78" y="78"  width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="96"  width="72" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>

    <rect x="78" y="120" width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="138" width="62" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>

    <rect x="78" y="162" width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="180" width="52" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>
  </g>

  <!-- The copilot: one spark, at the corner of the page it is reading. -->
  <path d="M199 44 L206.5 63.5 L226 71 L206.5 78.5 L199 98 L191.5 78.5 L172 71 L191.5 63.5 Z"
        fill="#fbbf24"/>
</svg>
