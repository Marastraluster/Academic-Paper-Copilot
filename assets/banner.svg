<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Academic Paper Copilot — read papers in two languages, locally">
  <title>Academic Paper Copilot</title>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- The mark, drawn at the same proportions as assets/logo.svg -->
  <g transform="translate(64 62) scale(0.6875)">
    <rect width="256" height="256" rx="56" fill="url(#mark)"/>
    <rect x="58" y="52" width="124" height="152" rx="14" fill="#ffffff" fill-opacity="0.97"/>
    <rect x="78" y="78"  width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="96"  width="72" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>
    <rect x="78" y="120" width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="138" width="62" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>
    <rect x="78" y="162" width="84" height="10" rx="5" fill="#1e293b"/>
    <rect x="78" y="180" width="52" height="10" rx="5" fill="#6366f1" fill-opacity="0.85"/>
    <path d="M199 44 L206.5 63.5 L226 71 L206.5 78.5 L199 98 L191.5 78.5 L172 71 L191.5 63.5 Z" fill="#fbbf24"/>
  </g>

  <!-- Wordmark and tagline. Neutral greys, so the banner reads on a light and a
       dark README without a background panel of its own. -->
  <text x="288" y="146"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="700" fill="#334155">Academic Paper Copilot</text>
  <rect x="290" y="166" width="360" height="5" rx="2.5" fill="url(#rule)"/>
  <text x="290" y="208"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="23" fill="#64748b">Read a paper, understand it, and translate it — locally, with your own model.</text>
</svg>
